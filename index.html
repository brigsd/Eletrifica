<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eletrifica</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23145c31'/><circle cx='5' cy='6' r='1.6' fill='%231f8a3b'/><circle cx='11' cy='10' r='1.6' fill='%231f8a3b'/><path d='M5 6h6v4' stroke='%23eef4f0' stroke-width='1' fill='none'/></svg>">
<style>
  :root { --bg: #0f1419; --panel: #161c23; --line: #263039; --ink: #e6edf3;
    --dim: #8b98a5; --accent: #4ea3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 32px; }
  .cards { display: grid; gap: 14px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  a.card:hover { border-color: var(--accent); }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card p { margin: 0; color: #c4d0dc; }
  .card .tag { color: var(--accent); font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; margin-bottom: 6px; }
  footer { margin-top: 36px; color: var(--dim); font-size: 13px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Eletrifica</h1>
  <p class="sub">Engenharia reversa de placas e simulação de hardware, tudo gerado por script.</p>
  <div class="cards">
    <a class="card" href="projetos/cnc-laser/">
      <div class="tag">Engenharia reversa · 3D</div>
      <h2>Controladora CNC / Laser ESP32</h2>
      <p>Placa reconstruída a partir do Gerber: gire, oculte peças e veja o que cada uma faz.</p>
    </a>
  </div>
  <footer><a href="https://github.com/brigsd/Eletrifica">repositório no GitHub</a></footer>
</main>
</body>
</html>
