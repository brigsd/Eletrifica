<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controladora CNC / Laser ESP32 — visualizador 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23145c31'/><circle cx='5' cy='6' r='1.6' fill='%231f8a3b'/><circle cx='11' cy='10' r='1.6' fill='%231f8a3b'/><path d='M5 6h6v4' stroke='%23eef4f0' stroke-width='1' fill='none'/></svg>">
<style>
  :root {
    --bg: #0f1419; --panel: #161c23; --line: #263039; --ink: #e6edf3;
    --dim: #8b98a5; --accent: #4ea3ff; --warn: #ff7b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 268px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 14px; }
  aside h1 { font-size: 15px; margin: 0 0 2px; }
  aside .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button { flex: 1; background: #1e2731; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grp { margin-bottom: 14px; }
  .grp > .head { display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 6px; }
  .grp > .head button { flex: 0 0 auto; padding: 2px 6px; font-size: 10px; }
  label.item { display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 5px; cursor: pointer; }
  label.item:hover { background: #1d2630; }
  label.item.sel { background: #1a2c3f; outline: 1px solid var(--accent); }
  label.item .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  label.item .rf { font-weight: 600; min-width: 42px; }
  label.item .nm { color: var(--dim); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  label.item .flag { color: var(--warn); font-size: 11px; }
  main { position: relative; }
  canvas { display: block; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--dim);
    font-size: 12px; background: rgba(15,20,25,.78); padding: 6px 10px;
    border-radius: 6px; border: 1px solid var(--line); }
  #info { position: absolute; right: 14px; top: 14px; width: 330px; max-height: 82%;
    overflow-y: auto; background: rgba(22,28,35,.97); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; display: none; }
  #info.on { display: block; }
  #info h2 { margin: 0 0 2px; font-size: 16px; }
  #info .ref { color: var(--accent); font-size: 12px; letter-spacing: .06em; }
  #info p { color: #c4d0dc; }
  #info .warn { color: var(--warn); border-left: 2px solid var(--warn);
    padding-left: 9px; }
  #info table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #info td { padding: 2px 0; border-bottom: 1px solid #1f2831; }
  #info td:first-child { color: var(--dim); width: 46px; }
  #close { position: absolute; right: 10px; top: 8px; background: none;
    border: none; color: var(--dim); font-size: 18px; cursor: pointer; width: auto; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Controladora CNC / Laser</h1>
    <div class="sub">ESP32 · 70,5 × 54,6 mm · 19 peças</div>
    <div class="row">
      <button id="all">Mostrar tudo</button>
      <button id="none">Ocultar tudo</button>
    </div>
    <div class="row">
      <button id="board-t">Placa</button>
      <button id="reset">Recentrar</button>
    </div>
    <div id="menu"></div>
    <div class="sub" style="margin:16px 0 0;border-top:1px solid var(--line);padding-top:12px">
      Posições vindas do Gerber da placa. Alturas dos corpos são as típicas de cada
      encapsulamento — o Gerber não guarda altura.
      <a href="https://github.com/brigsd/Achievements" style="color:var(--accent)">repositório</a>
    </div>
  </aside>
  <main>
    <div id="loading">carregando…</div>
    <div id="hint">arrastar gira · rolar aproxima · <b>duplo clique</b> numa peça abre o que ela faz</div>
    <div id="info"><button id="close">×</button><div id="info-body"></div></div>
  </main>
</div>

<script src="web/three.min.js"></script>
<script src="web/OrbitControls.js"></script>
<script>
(async function () {
  const data = await (await fetch("web/board.json")).json();
  const [bx0, by0, bx1, by1] = data.board.texture_box;
  const outline = data.board.outline;
  const cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2;

  const main = document.querySelector("main");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  main.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1419);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 2000);
  camera.up.set(0, 0, 1);
  const HOME = new THREE.Vector3(78, -88, 72);
  camera.position.copy(HOME);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(60, -80, 120); scene.add(key);
  const fill = new THREE.DirectionalLight(0x9fc4ff, 0.35);
  fill.position.set(-90, 60, 50); scene.add(fill);

  // everything is modelled in board millimetres; recentre so orbiting feels right
  const world = new THREE.Group();
  world.position.set(-cx, -cy, 0);
  scene.add(world);

  // ---- the board itself -------------------------------------------------
  const shape = new THREE.Shape();
  outline.forEach(([x, y], i) => i ? shape.lineTo(x, y) : shape.moveTo(x, y));
  const slab = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: data.board.thickness, bevelEnabled: false }),
    new THREE.MeshLambertMaterial({ color: 0x145c31 }));
  world.add(slab);

  const tex = new THREE.TextureLoader().load("web/board-texture.png");
  tex.anisotropy = 8;
  const face = new THREE.ShapeGeometry(shape);
  const pos = face.attributes.position, uv = [];
  for (let i = 0; i < pos.count; i++) {
    uv.push((pos.getX(i) - bx0) / (bx1 - bx0), (pos.getY(i) - by0) / (by1 - by0));
  }
  face.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  const artwork = new THREE.Mesh(face, new THREE.MeshLambertMaterial({ map: tex }));
  artwork.position.z = data.board.thickness + 0.03;
  world.add(artwork);

  // ---- the parts --------------------------------------------------------
  const pickable = [];
  const byRef = {};
  data.parts.forEach(part => {
    const g = new THREE.Group();
    part.solids.forEach(s => {
      const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(s.colour) });
      let mesh;
      if (s.shape === "cyl") {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(s.dia / 2, s.dia / 2, s.h, 26), mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(s.cx, s.cy, s.z + s.h / 2);
      } else {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.d, s.h), mat);
        mesh.position.set(s.cx, s.cy, s.z + s.h / 2);
      }
      mesh.userData.ref = part.ref;
      pickable.push(mesh);
      g.add(mesh);
    });
    world.add(g);
    byRef[part.ref] = { part, group: g };
  });

  const conflicts = {};
  data.clearance.forEach(c => {
    conflicts[c.part] = c; conflicts[c.module] = c;
  });

  // ---- menu -------------------------------------------------------------
  const menu = document.getElementById("menu");
  const order = ["Controle", "Eixos", "Alimentacao", "Laser", "Outros"];
  const titles = { Controle: "Controle", Eixos: "Eixos",
                   Alimentacao: "Alimentação", Laser: "Laser", Outros: "Outros" };
  const boxes = {};
  order.forEach(gname => {
    const items = data.parts.filter(p => p.group === gname);
    if (!items.length) return;
    const box = document.createElement("div");
    box.className = "grp";
    const head = document.createElement("div");
    head.className = "head";
    head.innerHTML = `<span>${titles[gname]}</span>`;
    const t = document.createElement("button");
    t.textContent = "alternar";
    t.onclick = () => {
      const on = items.some(p => boxes[p.ref].checked);
      items.forEach(p => { boxes[p.ref].checked = !on; apply(p.ref); });
    };
    head.appendChild(t);
    box.appendChild(head);
    items.forEach(p => {
      const l = document.createElement("label");
      l.className = "item";
      l.dataset.ref = p.ref;
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = true;
      cb.onchange = () => apply(p.ref);
      boxes[p.ref] = cb;
      const sw = document.createElement("span");
      sw.className = "sw";
      sw.style.background = p.solids[p.solids.length - 1].colour;
      const rf = document.createElement("span");
      rf.className = "rf"; rf.textContent = p.ref;
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = p.title;
      l.append(cb, sw, rf, nm);
      if (conflicts[p.ref]) {
        const f = document.createElement("span");
        f.className = "flag"; f.textContent = "▲"; f.title = "conflito de folga";
        l.appendChild(f);
      }
      l.ondblclick = e => { e.preventDefault(); show(p.ref); };
      box.appendChild(l);
    });
    menu.appendChild(box);
  });

  function apply(ref) { byRef[ref].group.visible = boxes[ref].checked; }
  document.getElementById("all").onclick =
    () => Object.keys(boxes).forEach(r => { boxes[r].checked = true; apply(r); });
  document.getElementById("none").onclick =
    () => Object.keys(boxes).forEach(r => { boxes[r].checked = false; apply(r); });
  document.getElementById("board-t").onclick =
    () => { slab.visible = artwork.visible = !slab.visible; };
  document.getElementById("reset").onclick = () => {
    camera.position.copy(HOME); controls.target.set(0, 0, 0); controls.update();
  };

  // ---- info panel -------------------------------------------------------
  const info = document.getElementById("info");
  const infoBody = document.getElementById("info-body");
  document.getElementById("close").onclick = () => {
    info.classList.remove("on");
    document.querySelectorAll("label.item").forEach(l => l.classList.remove("sel"));
  };

  function show(ref) {
    const p = byRef[ref].part;
    const c = conflicts[ref];
    const rows = p.pins.map(x => `<tr><td>${x.n}</td><td>${x.net}</td></tr>`).join("");
    infoBody.innerHTML = `
      <div class="ref">${p.ref}</div>
      <h2>${p.title}</h2>
      <p>${p.desc}</p>
      ${c ? `<p class="warn"><b>Conflito de folga.</b> ${c.part} tem topo em
        ${c.top} mm e o vão sob ${c.module} é de ${c.gap} mm: faltam
        ${c.overlap} mm. As alturas são valores típicos, não saem do Gerber.</p>` : ""}
      <p style="color:#8b98a5;font-size:12px;margin-bottom:4px">
        LIGAÇÕES (pino → net)</p>
      <table>${rows}</table>`;
    info.classList.add("on");
    document.querySelectorAll("label.item").forEach(l =>
      l.classList.toggle("sel", l.dataset.ref === ref));
  }

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();

  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(pickable.filter(m => m.parent.visible))[0];
  }
  renderer.domElement.addEventListener("pointermove", e => {
    renderer.domElement.style.cursor = pick(e) ? "pointer" : "default";
  });
  renderer.domElement.addEventListener("dblclick", e => {
    const hit = pick(e);
    if (hit) show(hit.object.userData.ref);
  });

  function resize() {
    const w = main.clientWidth, h = main.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  document.getElementById("loading").remove();

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
